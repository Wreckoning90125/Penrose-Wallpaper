# npm (web), gradle (android), and actions — weekly, fleet cadence and cooldowns.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "America/Los_Angeles"}
    open-pull-requests-limit: 5
    cooldown: {default-days: 7, semver-major-days: 21}
    groups:
      npm-dev: {dependency-type: "development", patterns: ["*"], update-types: ["minor", "patch"]}
      npm-prod-minor-patch: {dependency-type: "production", patterns: ["*"], update-types: ["minor", "patch"]}
    labels: ["dependencies", "javascript"]
    commit-message: {prefix: "deps"}
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "America/Los_Angeles"}
    open-pull-requests-limit: 3
    cooldown: {default-days: 7, semver-major-days: 21}
    groups:
      gradle: {patterns: ["*"], update-types: ["minor", "patch"]}
    labels: ["dependencies", "android"]
    commit-message: {prefix: "deps"}
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly", day: "monday", time: "06:00", timezone: "America/Los_Angeles"}
    open-pull-requests-limit: 3
    groups:
      actions: {patterns: ["*"]}
    labels: ["dependencies", "ci"]
