name: Android build

# Third-party actions are pinned by full commit SHA, not tag. Tags can be
# moved silently (whoever holds the tag-write bit can re-point them at any
# commit, including a malicious one), so pinning by SHA is the only way to
# get reproducible, audit-able builds. Each SHA below is annotated with the
# release tag it corresponds to so we can review upgrades intentionally.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          packages: ""

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          gradle-version: "9.4.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/android-live-wallpaper-bciyO' }}

      - name: Build release APK
        # Signed with the committed debug keystore (app/debug.keystore). Not
        # suitable for Play Store but installable directly on any device.
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Rename APK with commit SHA
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          dst="app/build/outputs/apk/release/penrose-${GITHUB_SHA:0:7}.apk"
          mv "$src" "$dst"
          echo "Built $dst ($(stat -c%s "$dst") bytes)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: penrose-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
