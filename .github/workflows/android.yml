name: Android build

# Third-party actions are pinned by full commit SHA, not tag. Tags can be
# moved silently (whoever holds the tag-write bit can re-point them at any
# commit, including a malicious one), so pinning by SHA is the only way to
# get reproducible, audit-able builds. Each SHA below is annotated with the
# release tag it corresponds to so we can review upgrades intentionally.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          packages: ""

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          gradle-version: "9.4.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Android Lint — Google's curated static analysis for Kotlin /
      # manifest / resources. Promoted to a gating step so regressions
      # (exported flags, FGS permissions, deprecated APIs) fail the PR
      # rather than biting at install time. SARIF feeds GitHub code
      # scanning on the next step; HTML report is uploaded as an
      # artifact for direct browsing.
      - name: Android Lint
        run: gradle --no-daemon --stacktrace lintRelease

      - name: Upload Lint HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: lint-report-${{ github.sha }}
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Lint SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@4f3212b61783c3c68e8309a0f18a699764811cda  # v3.27.5
        with:
          sarif_file: android/app/build/reports/lint-results-release.sarif
          category: android-lint
        # SARIF upload needs `Security events: write` repo permission;
        # warn-only so PRs from forks still succeed.
        continue-on-error: true

      - name: Build release APK
        # Signed with the committed debug keystore (app/debug.keystore). Not
        # suitable for Play Store but installable directly on any device.
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Rename APK with commit SHA
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          dst="app/build/outputs/apk/release/penrose-${GITHUB_SHA:0:7}.apk"
          mv "$src" "$dst"
          echo "Built $dst ($(stat -c%s "$dst") bytes)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: penrose-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Post-build verification of the APK the toolchain just produced and
      # published. The source build proves the code compiles; this proves
      # the *artifact* is sound — signature, manifest, payload (native
      # libs, SPIR-V shaders, presets), and the main catch: that
      # libpenrose.so exports a Java_* symbol for every `external fun` in
      # NativeBridge.kt, so a JNI mismatch fails CI here instead of
      # crashing the app with UnsatisfiedLinkError on first native call.
      - name: Verify release APK
        run: bash ../scripts/verify-apk.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)"

  # Parallel job: UBSan-instrumented debug APK. Cheap (a few percent
  # overhead) and catches signed-overflow, null-deref, shift-out-of-range
  # and function-pointer-cast mismatches the moment they happen on a
  # device. Independent of the release job so a sanitizer trip here
  # doesn't block APK delivery — install this APK on the test device
  # to reproduce crashes under instrumented libclang_rt.
  sanitized-debug:
    name: assembleDebug (UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          packages: ""

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          gradle-version: "9.4.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build UBSan-instrumented debug APK
        run: gradle --no-daemon --stacktrace -PpenroseSanitize=undefined assembleDebug

      - name: Upload sanitized debug APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: penrose-debug-ubsan-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  # Parallel job: certify the tiling families. Links the production tiling
  # core (tiling/penrose.cpp) with a host compiler — no Android SDK, no
  # Vulkan — and runs tools/verify_tilings.cpp, which proves every family
  # conserves area under deflation and tiles its region with no gap and no
  # overlap. This gates substitution-rule regressions on every push, the
  # same closure argument used to derive the rules in the first place.
  tiling-verify:
    name: verify tilings
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Compile the tiling core and the verifier
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -I android/app/src/main/cpp \
            tools/verify_tilings.cpp \
            android/app/src/main/cpp/tiling/penrose.cpp \
            -o verify_tilings

      - name: Run substitution / closure verification
        run: ./verify_tilings

  # Parallel job: validate the renderer's GLSL. Toolchain-light and fast
  # (seconds, no Android SDK) — mirrors tiling-verify's focused-subsystem
  # spirit. Compiles every shader to SPIR-V with glslangValidator against the
  # Vulkan 1.3 target the renderer negotiates, then runs spirv-val on each
  # module. A shader regression fails here in seconds instead of deep inside
  # the NDK build's glslc step twenty minutes later.
  shader-validate:
    name: validate shaders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install Vulkan shader tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools

      - name: Compile and validate every shader
        working-directory: android/app/src/main/shaders
        run: |
          status=0
          for s in *.vert *.frag *.comp; do
            [ -e "$s" ] || continue
            echo "== $s =="
            if glslangValidator -V --target-env vulkan1.3 "$s" -o "/tmp/$s.spv"; then
              spirv-val "/tmp/$s.spv" || status=1
            else
              status=1
            fi
          done
          exit $status

  # On pull requests: fail the PR if it introduces a dependency with a known
  # vulnerability or a disallowed licence. Reads the GitHub dependency graph
  # kept current by the dependency-submission job below.
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          comment-summary-in-pr: on-failure

  # On main only: submit the resolved Gradle dependency graph to GitHub so
  # Dependabot alerts and the dependency-review job above see an accurate
  # picture. Gradle's graph is dynamic, so it must be submitted — GitHub does
  # not parse it from the build files. Needs the full Android SDK + NDK
  # because AGP configuration (which dependency resolution triggers) locates
  # the NDK through build.gradle.kts's resolveNdkPath(). main-only, so it
  # never gates a PR.
  dependency-submission:
    name: submit dependency graph
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: write

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4.8.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3.2.2
        with:
          packages: ""

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          gradle-version: "9.4.1"
          build-root-directory: android
