name: Android build

# Third-party actions are pinned by full commit SHA. Each SHA is annotated
# with the release tag it corresponds to so upgrades stay explicit.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Verify the committed gradle-wrapper.jar against Gradle's published
  # checksums so a tampered wrapper fails CI immediately. Same pinned
  # gradle/actions commit as the setup-gradle steps below.
  wrapper-validation:
    name: validate gradle wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate Gradle wrapper jar
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0

  build:
    name: assembleRelease
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Lint emits SARIF; upload-sarif needs `security-events: write` to push
    # it to the repo's code-scanning database. Without this the upload step
    # logs "Resource not accessible by integration". `contents: read` keeps
    # actions/checkout working under
    # the explicit grant (declaring `permissions:` at all drops the default
    # read-all that GITHUB_TOKEN normally carries).
    permissions:
      contents: read
      security-events: write

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          packages: ""

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          gradle-version: "9.6.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Android Lint — Google's curated static analysis for Kotlin /
      # manifest / resources. Promoted to a gating step so regressions
      # (exported flags, FGS permissions, deprecated APIs) fail the PR
      # rather than biting at install time. SARIF feeds GitHub code
      # scanning on the next step; HTML report is uploaded as an
      # artifact for direct browsing.
      - name: Android Lint
        run: gradle --no-daemon --stacktrace lintRelease

      - name: Upload Lint HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lint-report-${{ github.sha }}
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Lint SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lint-sarif-${{ github.sha }}
          path: android/app/build/reports/lint-results-release.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lint SARIF to GitHub code scanning
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: android/app/build/reports/lint-results-release.sarif
          category: android-lint

      - name: Build release APK
        # Signed with the committed debug keystore (app/debug.keystore). Not
        # suitable for Play Store but installable directly on any device.
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Rename APK with commit SHA
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          dst="app/build/outputs/apk/release/penrose-${GITHUB_SHA:0:7}.apk"
          mv "$src" "$dst"
          echo "Built $dst ($(stat -c%s "$dst") bytes)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: penrose-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Post-build verification of the APK the toolchain just produced and
      # published. The source build proves the code compiles; this proves
      # the *artifact* is sound — signature, manifest, payload (native
      # libs, SPIR-V shaders, presets), and the main catch: that
      # libpenrose.so exports a Java_* symbol for every `external fun` in
      # NativeBridge.kt, so a JNI mismatch fails CI here instead of
      # crashing the app with UnsatisfiedLinkError on first native call.
      - name: Verify release APK
        run: bash ../scripts/verify-apk.sh "$(ls app/build/outputs/apk/release/*.apk | head -1)"

  # UBSan catches signed-overflow, null-deref, shift-out-of-range, and
  # function-pointer-cast mismatches in the native renderer.
  sanitized-debug:
    name: assembleDebug (UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          packages: ""

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          gradle-version: "9.6.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build UBSan-instrumented debug APK
        run: gradle --no-daemon --stacktrace -PpenroseSanitize=undefined assembleDebug

      - name: Upload sanitized debug APK
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: penrose-debug-ubsan-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

  # Parallel job: certify the tiling families. Links the production tiling
  # core (tiling/penrose.cpp) with a host compiler — no Android SDK, no
  # Vulkan — and runs tools/verify_tilings.cpp, which proves every family
  # conserves area under deflation and tiles its region with no gap and no
  # overlap. This gates substitution-rule regressions on every push, the
  # same closure argument used to derive the rules in the first place.
  tiling-verify:
    name: verify tilings
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compile the tiling core and the verifier
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -I android/app/src/main/cpp \
            tools/verify_tilings.cpp \
            android/app/src/main/cpp/tiling/penrose.cpp \
            -o verify_tilings

      - name: Run substitution / closure verification
        run: ./verify_tilings

  # Parallel job: validate the renderer's GLSL. Toolchain-light and fast
  # (seconds, no Android SDK) — mirrors tiling-verify's focused-subsystem
  # spirit. Compiles every shader to SPIR-V with glslangValidator against the
  # Vulkan 1.3 target the renderer negotiates, then runs spirv-val on each
  # module. A shader regression fails here in seconds instead of deep inside
  # the NDK build's glslc step twenty minutes later.
  shader-validate:
    name: validate shaders
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Vulkan shader tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools

      - name: Compile and validate every shader
        working-directory: android/app/src/main/shaders
        run: |
          status=0
          for s in *.vert *.frag *.comp; do
            [ -e "$s" ] || continue
            echo "== $s =="
            if glslangValidator -V --target-env vulkan1.3 "$s" -o "/tmp/$s.spv"; then
              spirv-val "/tmp/$s.spv" || status=1
            else
              status=1
            fi
          done
          exit $status

  native-static-analysis:
    name: clang-tidy native renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
        working-directory: ${{ github.workspace }}

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          packages: ""

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          gradle-version: "9.6.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run clang-tidy through CMake
        run: |
          set -o pipefail
          mkdir -p ../build
          gradle --no-daemon --stacktrace -PpenroseTidy=true assembleDebug 2>&1 | tee ../build/clang-tidy.log

      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: clang-tidy-log-${{ github.sha }}
          path: build/clang-tidy.log
          if-no-files-found: error
          retention-days: 14

  static-analysis-ratchet:
    name: static analysis ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build, native-static-analysis]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download Android Lint SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lint-sarif-${{ github.sha }}
          path: build/static-analysis

      - name: Download clang-tidy log
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: clang-tidy-log-${{ github.sha }}
          path: build/static-analysis

      - name: Enforce total static-analysis budget
        run: |
          python3 tools/static_analysis_ratchet.py \
            --sarif build/static-analysis/lint-results-release.sarif \
            --clang-tidy-log build/static-analysis/clang-tidy.log

  web:
    name: repo quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install native quality tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy glslang-tools spirv-tools

      - name: Run local quality gate
        run: npm run quality:local

  # On pull requests: fail the PR if it introduces a critical dependency issue.
  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: critical
          comment-summary-in-pr: on-failure

  # Submit the resolved Gradle dependency graph on main so Dependabot and
  # Dependency Review see AGP's actual dependency model.
  dependency-submission:
    name: submit dependency graph
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    permissions:
      contents: write

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          packages: ""

      - name: Install required SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          gradle-version: "9.6.1"
          build-root-directory: android
          # Report what ships in the APK. The default "resolve all" graph
          # includes Gradle/plugin classpaths, which created Dependabot alerts
          # for Netty/BouncyCastle/JDOM used by build tooling, not by Penrose.
          dependency-graph-include-configurations: "releaseRuntimeClasspath"
