name: "CodeQL"

# Semantic security analysis. C/C++ and the workflow files scan build-free;
# Kotlin needs a real build (build-mode none analyses Java only), and that
# build is an Android NDK build, so the SDK + NDK are installed for it.
# Third-party actions are pinned by full commit SHA — see android.yml.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "34 22 * * 4"

# A new commit cancels a superseded PR run; main and scheduled runs always
# finish so the Security tab stays current.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native renderer / tiling / audio core. build-mode none infers
          # compilation units from the sources — no Android NDK required.
          - language: c-cpp
            build-mode: none
          # The app layer is entirely Kotlin. build-mode none analyses Java
          # only and would skip every .kt file, so Kotlin needs a real build;
          # autobuild cannot drive the NDK build, hence manual.
          - language: java-kotlin
            build-mode: manual
          # Lints the workflow files themselves.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Java/Kotlin only: CodeQL traces the build below to extract Kotlin.
      # It is an Android NDK build, so the SDK + NDK must be present —
      # Gradle configuration resolves the NDK path even for a Kotlin compile.
      - name: Set up JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          packages: ""

      - name: Install required SDK packages
        if: matrix.language == 'java-kotlin'
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6.3.0
        with:
          gradle-version: "9.6.1"
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Build Java/Kotlin
        if: matrix.build-mode == 'manual'
        working-directory: android
        # CodeQL's tracer only sees code that actually compiles: with a warm
        # build cache every compile task resolves FROM-CACHE and the analysis
        # fails with "no source code seen", so bypass task caching here.
        run: gradle --no-daemon --stacktrace --no-build-cache --no-configuration-cache assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
