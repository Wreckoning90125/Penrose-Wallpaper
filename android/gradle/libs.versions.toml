[versions]
agp = "9.2.1"
ndk = "29.0.14206865"
compileSdk = "36"
minSdk = "36"
targetSdk = "36"
appcompat = "1.7.1"
preference = "1.2.1"
material = "1.13.0"
media3 = "1.10.0"
# androidx.core provides the KTX extensions we use (Uri.toUri, prefs.edit {});
# pinned ahead of androidx.appcompat so the Lint UseKtx hints have a target.
coreKtx = "1.18.0"
# Lifecycle 2.10 is the latest stable as of 2026-05. We pull
# lifecycle-runtime-ktx for the DefaultLifecycleObserver / Lifecycle
# wiring used by RendererSession: Activities call
# lifecycle.addObserver(session) and ON_DESTROY auto-fires
# session.shutdown(). No ViewModel / LiveData / Compose dependency.
lifecycle = "2.10.0"
# Coroutines 1.10 is current. We depend on the -android variant so the
# Main dispatcher resolves to AndroidUiDispatcher without service-loader
# gymnastics. Adopted to replace the hand-rolled HandlerThread +
# @Volatile + runWithBarrier dance that was the root cause of
# multi-thread native-pointer races.
coroutines = "1.10.2"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
material = { module = "com.google.android.material:material", version.ref = "material" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
