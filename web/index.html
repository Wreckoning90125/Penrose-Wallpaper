<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07080a" />
    <title>Penrose Wallpaper</title>
  </head>
  <body>
    <main id="app">
      <section id="viewport" aria-label="Tiling renderer"></section>
      <aside id="controls" aria-label="Controls">
        <header>
          <div>
            <p class="eyebrow">Penrose Wallpaper</p>
            <h1 id="targetTitle">Loading</h1>
          </div>
          <div class="status">
            <span id="tileCount">0</span>
            <span>tiles</span>
          </div>
        </header>

        <div class="control-grid">
          <label>
            <span>Category</span>
            <select id="categorySelect"></select>
          </label>
          <label>
            <span>Target</span>
            <select id="targetSelect"></select>
          </label>
        </div>

        <section class="panel-section">
          <div class="section-title">Color</div>
          <div class="segmented" id="colorMode">
            <button type="button" data-mode="0">Type</button>
            <button type="button" data-mode="1">Orient</button>
            <button type="button" data-mode="2">Ring</button>
          </div>
          <label class="range-row">
            <span>Slots</span>
            <input id="colorCount" type="range" min="2" max="16" step="1" />
            <output id="colorCountValue"></output>
          </label>
          <div class="swatches" id="swatches"></div>
          <div class="color-editor">
            <canvas id="colorWheel" width="220" height="220" aria-label="OKLCH hue and chroma selector"></canvas>
            <label class="range-row">
              <span>Light</span>
              <input id="lightness" type="range" min="0" max="1" step="0.001" />
              <output id="lightnessValue"></output>
            </label>
            <div class="gamut" id="gamutLabel"></div>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-title">Material</div>
          <label class="range-row">
            <span>Relief</span>
            <input id="matRelief" type="range" min="0" max="160" step="1" />
            <output id="matReliefValue"></output>
          </label>
          <label class="range-row">
            <span>Rough</span>
            <input id="matRoughness" type="range" min="0" max="100" step="1" />
            <output id="matRoughnessValue"></output>
          </label>
          <label class="range-row">
            <span>Metal</span>
            <input id="matMetalness" type="range" min="0" max="100" step="1" />
            <output id="matMetalnessValue"></output>
          </label>
          <label class="range-row">
            <span>Coat</span>
            <input id="matClearcoat" type="range" min="0" max="100" step="1" />
            <output id="matClearcoatValue"></output>
          </label>
          <label class="range-row">
            <span>Film</span>
            <input id="matIridescence" type="range" min="0" max="100" step="1" />
            <output id="matIridescenceValue"></output>
          </label>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
