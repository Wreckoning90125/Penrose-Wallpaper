<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#0b0b10" />
<title>Penrose · P3</title>
<link rel="stylesheet" href="penrose.css" />
</head>
<body>
  <div id="bgimg"></div>
  <canvas id="c"></canvas>

  <div class="topbar" id="topbar">
    <div class="title">Penrose · P3</div>
    <div class="meta"><span id="tilesCount">0</span> tiles</div>
  </div>

  <div class="float tr">
    <button class="btn icon" id="fsBtn" aria-label="Fullscreen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V3h6"/><path d="M21 9V3h-6"/><path d="M3 15v6h6"/><path d="M21 15v6h-6"/></svg>
    </button>
  </div>
  <div class="float br">
    <button class="btn icon show-panel" id="showPanelBtn" aria-label="Show controls">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>
    </button>
  </div>

  <div class="hint" id="hint">pinch · drag · double-tap to hide</div>

  <div class="panel" id="panel">
    <div class="tabs">
      <button class="tab active" data-tab="tiling">Tiling</button>
      <button class="tab" data-tab="color">Color</button>
      <button class="tab" data-tab="border">Border</button>
      <button class="tab" data-tab="bg">Background</button>
    </div>

    <div class="pane active" data-pane="tiling">
      <div class="row">
        <span class="label">Family</span>
        <div class="seg" id="familySeg">
          <button data-fam="p3" class="on">P3</button>
          <button data-fam="p2">P2</button>
          <button data-fam="chair">Chair</button>
        </div>
      </div>
      <div class="row">
        <span class="label">Gen</span>
        <div class="step">
          <button class="btn icon" id="genDown" aria-label="Decrease">−</button>
          <span class="value" id="genVal">6</span>
          <button class="btn icon" id="genUp" aria-label="Increase">+</button>
        </div>
      </div>
      <div class="row">
        <span class="label">Seed</span>
        <button class="btn icon" id="seedPrev" aria-label="Previous seed">‹</button>
        <span class="value" id="seedName" style="min-width:100px">Sun</span>
        <button class="btn icon" id="seedNext" aria-label="Next seed">›</button>
      </div>
      <div class="row">
        <span class="label">Zoom</span>
        <input type="range" id="zoom" min="0.3" max="6" step="0.01" value="1" />
        <button class="btn icon" id="resetBtn" aria-label="Reset view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
        </button>
      </div>
      <div class="row">
        <span class="label">Rotate</span>
        <input type="range" id="rotate" min="0" max="360" step="0.5" value="0" />
        <span class="value" id="rotVal">0°</span>
      </div>
    </div>

    <div class="pane" data-pane="color">
      <div class="row">
        <span class="label">Mode</span>
        <div class="seg" id="colorMode">
          <button data-mode="type" class="on">Type</button>
          <button data-mode="orient">Orient</button>
          <button data-mode="ring">Ring</button>
        </div>
      </div>
      <div class="row" id="colorCountRow">
        <span class="label">Colors</span>
        <input type="range" id="colorCount" min="2" max="10" step="1" value="2" />
        <span class="value" id="colorCountVal">2</span>
      </div>
      <div class="row">
        <span class="label">Edit</span>
        <div class="palette-strip" id="paletteStrip"></div>
      </div>
      <div class="editor hidden" id="colorEditor">
        <div class="preview" id="colorPreview"></div>
        <div class="row">
          <span class="label">L</span>
          <input type="range" id="oklchL" min="0" max="1" step="0.001" value="0.7" />
          <span class="value" id="oklchLVal">.70</span>
        </div>
        <div class="row">
          <span class="label">C</span>
          <input type="range" id="oklchC" min="0" max="0.37" step="0.001" value="0.12" />
          <span class="value" id="oklchCVal">.12</span>
        </div>
        <div class="row">
          <span class="label">H</span>
          <input type="range" id="oklchH" min="0" max="360" step="0.5" value="80" />
          <span class="value" id="oklchHVal">80°</span>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <span class="label">Preset</span>
        <div class="presets" id="presets"></div>
      </div>
    </div>

    <div class="pane" data-pane="border">
      <div class="row">
        <span class="label">Borders</span>
        <button class="btn toggle on" id="borderToggle">On</button>
      </div>
      <div class="row">
        <span class="label">Width</span>
        <input type="range" id="borderWidth" min="0" max="6" step="0.05" value="0.8" />
        <span class="value" id="borderWidthVal">0.8</span>
      </div>
      <div class="editor">
        <div class="preview" id="borderPreview"></div>
        <div class="row">
          <span class="label">L</span>
          <input type="range" id="borderL" min="0" max="1" step="0.001" value="0.95" />
          <span class="value" id="borderLVal">.95</span>
        </div>
        <div class="row">
          <span class="label">C</span>
          <input type="range" id="borderC" min="0" max="0.37" step="0.001" value="0" />
          <span class="value" id="borderCVal">.00</span>
        </div>
        <div class="row">
          <span class="label">H</span>
          <input type="range" id="borderH" min="0" max="360" step="0.5" value="0" />
          <span class="value" id="borderHVal">0°</span>
        </div>
        <div class="row">
          <span class="label">Alpha</span>
          <input type="range" id="borderA" min="0" max="1" step="0.01" value="0.35" />
          <span class="value" id="borderAVal">.35</span>
        </div>
      </div>
    </div>

    <div class="pane" data-pane="bg">
      <div class="row">
        <span class="label">Mode</span>
        <div class="seg" id="bgMode">
          <button data-bg="solid" class="on">Solid</button>
          <button data-bg="match">Match</button>
          <button data-bg="image">Image</button>
        </div>
      </div>
      <div class="row" data-bgrow="solid">
        <span class="label">L</span>
        <input type="range" id="bgOklchL" min="0" max="1" step="0.001" value="0.04" />
        <span class="value" id="bgOklchLVal">.04</span>
      </div>
      <div class="row" data-bgrow="solid">
        <span class="label">C</span>
        <input type="range" id="bgOklchC" min="0" max="0.37" step="0.001" value="0.005" />
        <span class="value" id="bgOklchCVal">.01</span>
      </div>
      <div class="row" data-bgrow="solid">
        <span class="label">H</span>
        <input type="range" id="bgOklchH" min="0" max="360" step="0.5" value="280" />
        <span class="value" id="bgOklchHVal">280°</span>
      </div>
      <div class="row" data-bgrow="image" style="display:none">
        <span class="label">Image</span>
        <input type="file" id="bgFile" accept="image/*" />
        <button class="btn" id="bgFileBtn" style="flex:1">Choose image…</button>
        <button class="btn icon" id="bgClearBtn" aria-label="Clear image" title="Clear image">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="row" data-bgrow="image" style="display:none">
        <span class="label">Fit</span>
        <div class="seg" id="bgFit">
          <button data-fit="cover" class="on">Cover</button>
          <button data-fit="contain">Contain</button>
        </div>
      </div>
    </div>
  </div>

  <script src="penrose.js"></script>
</body>
</html>
